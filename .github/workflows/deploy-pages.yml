
name: Deploy BONELAB MOD HUB

on:
  push:
    paths:
      - 'BONELAB-MOD-HUB-UPDATED.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract website ZIP
        run: |
          mkdir extracted _site
          unzip -o BONELAB-MOD-HUB-UPDATED.zip -d extracted

          INDEX=$(find extracted -name index.html -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi

          ROOT=$(dirname "$INDEX")
          cp -a "$ROOT"/. _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
